buildscript {
	repositories {
		maven {
			name = "Fabric"
			url = "https://maven.fabricmc.net/"
		}
		mavenCentral()
		//jcenter()
	}
	dependencies {
		classpath 'net.fabricmc:fabric-loom:0.7-SNAPSHOT'
		//classpath 'com.github.fudge:forgedflowerloom:2.0.0'
	}
}

apply plugin: "fabric-loom"
//apply plugin: "maven-publish"

/*
plugins {
	id 'maven-publish'
	id 'fabric-loom' version "0.6-SNAPSHOT"
}
*/

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

ext.configFile = file "build.properties"

configFile.withReader {
	def prop = new Properties()
	prop.load(it)
	project.ext.config = new ConfigSlurper().parse prop
}

archivesBaseName = project.archives_base_name
version = project.mod_version
group = project.maven_group

repositories {
	maven {
		name = 'legacy-fabric'
		url = 'https://maven.legacyfabric.net'
		//url = 'https://dl.bintray.com/legacy-fabric/Legacy-Fabric-Maven'
	}
	maven {
		name = 'Jitpack'
		url = 'https://jitpack.io'
	}
}

dependencies {
	implementation "com.google.guava:guava:23.5-jre"
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings_version}:v2"
	modApi "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
	compile "com.google.code.findbugs:jsr305:3+"
	//modImplementation "net.legacyfabric.legacy-fabric-api:legacy-fabric-api:${fabric_api_version}"
	//modImplementation("com.github.shedaniel:fabric-loader:${project.loader_version}")
}

minecraft {
	intermediaryUrl = {
		return "https://maven.legacyfabric.net/net/fabricmc/intermediary/" + it + "/intermediary-" + it + "-v2.jar";
		//return "https://dl.bintray.com/legacy-fabric/Legacy-Fabric-Maven/net/fabricmc/intermediary/" + it + "/intermediary-" + it + "-v2.jar";
	}

	ext.mod_version = config.mod_version

	if (mod_version.endsWith('-dev')) {
		mod_version = mod_version + "." + new Date().format('yyyyMMdd.HHmmss')
	}
}

compileJava {
	sourceCompatibility = JavaVersion.VERSION_1_8
	targetCompatibility = JavaVersion.VERSION_1_8
	options.encoding = 'UTF-8'
}

group = config.group + "." + config.mod_id
archivesBaseName = config.mod_file_name + '-' + config.minecraft_version_out
version = project.minecraft.mod_version

processResources {
	inputs.property "version", project.version

	from(sourceSets.main.resources.srcDirs) {
		include "fabric.mod.json"
		expand "version": project.version
	}

	from(sourceSets.main.resources.srcDirs) {
		exclude "fabric.mod.json"
	}
}

// ensure that the encoding is set to UTF-8, no matter what the system default is
// this fixes some edge cases with special characters not displaying correctly
// see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
tasks.withType(JavaCompile) {
	options.encoding = "UTF-8"
}

// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
// if it is present.
// If you remove this task, sources will not be generated.
task sourcesJar(type: Jar, dependsOn: classes) {
	classifier = "sources"
	from sourceSets.main.allSource
}

jar {
	from "LICENSE"
}

